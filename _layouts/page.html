<!doctype html>
<!-- プライバシーポリシーなど、文章だけのページのデザインです。文章は各ページの .md ファイルで編集してください。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | escape }}|{{ site.title | escape }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B1B1F; --muted:#55524C; --paper:#FFFFFF; --sand:#F3F1EC; --line:#D6D3CC;
  --accent:#1E46B4; --accent-dark:#142F7A;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Zen Kaku Gothic New','Hiragino Sans',sans-serif;font-size:16px;line-height:1.9}
a{color:var(--accent)} a:hover{color:var(--accent-dark)}
.wrap{max-width:760px;margin:0 auto;padding:0 24px}
.top{background:var(--sand);padding:20px 0}
.top a{font-weight:700;text-decoration:none}
.top a:hover{text-decoration:underline}
article{padding:48px 0 72px}
article h1{font-size:clamp(28px,5vw,40px);font-weight:900;line-height:1.3;margin:0 0 8px}
.updated{margin:0 0 32px;font-size:14px;color:var(--muted)}
article h2{font-size:20px;font-weight:900;margin:40px 0 12px;padding-top:16px;border-top:1px solid var(--line)}
article p{margin:0 0 16px}
article ul{margin:0 0 16px;padding-left:1.4em}
article li{margin-bottom:6px}
footer{border-top:1px solid var(--line);padding:32px 0 48px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted)}
</style>
</head>
<body>

<div class="top">
  <div class="wrap"><a href="{{ '/' | relative_url }}">← {{ site.title | escape }}</a></div>
</div>

<main class="wrap">
  <article>
    <h1>{{ page.title | escape }}</h1>
    {% if page.updated %}<p class="updated">最終更新日:{{ page.updated | escape }}</p>{% endif %}
    {{ content }}
  </article>
</main>

<footer>
  <div class="wrap">
    <span>Creative Learning Conference Japan 実行委員会</span>
    <a href="{{ '/' | relative_url }}">告知ページへ戻る</a>
  </div>
</footer>

</body>
</html>
